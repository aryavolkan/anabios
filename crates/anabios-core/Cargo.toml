[package]
name = "anabios-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic agent-based ecology simulation core for anabios."

[dependencies]
glam = { workspace = true }
rand = { workspace = true }
rand_xoshiro = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
smallvec = { workspace = true }
bitvec = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
libm = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
anyhow = { workspace = true }

[[bench]]
name = "tick_bench"
harness = false

# `cargo llvm-cov` sets `--cfg coverage` for the whole build. Declare it as a
# known cfg so `cfg!(coverage)` (used in tests to shorten instrumented sim runs)
# doesn't trip the `unexpected_cfgs` lint under `-D warnings` in the non-coverage
# CI jobs, where the cfg is simply false.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
