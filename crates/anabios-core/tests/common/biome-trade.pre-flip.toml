# UPDATE 2026-07-27 (climate-driven worldgen): under the new Whittaker climate
# classification the old hub (710, 870) is cold-temperate (Taiga/Tundra, no
# Desert -> no Salt). The cluster centers were re-scanned on this seed and moved
# to (1008, 696) — a subtropical hub carrying all four goods' source terrains
# within radius 70. The historical note below predates the new generator.
#
# Biome trade goods: five species co-located in one cluster centered at
# (1008, 696) — found by scanning this seed's biome field for the local
# terrain composition with the best resource-diversity/trade-proximity
# trade-off. All four land types (and hence all four goods) are reachable
# within radius 70.
#
# Co-locating the clusters (same pattern as `predator-prey.toml`, which
# relies on the same nearest-other-species sensor to land combat within
# range) is what makes cross-species trade land: the grazer archetype starts
# at full energy, so its `energy > 30` program branch immediately favors
# nearest-neighbor-seeking over plant-seeking, and it barely relocates over
# hundreds of ticks — whatever terrain (and neighbors) the cluster spawns
# among is effectively fixed for the whole run. Two earlier drafts failed
# outright: five clusters spread to the map's corners + center (centered on
# center_x/y = 512.0, a lake in this seed's biome) put nearly the whole
# population on Water with no terrain diversity and zero trades in 600
# ticks; bringing those same five clusters closer together while still
# centered on the lake had the same failure. Centering on real, water-free,
# all-four-goods terrain (discovered by sampling the biome field directly)
# is what unblocks `ResourceTraded`.
#
# Basket completion needed a resource-balance change, made in `resource.rs`
# (out of this scenario file's scope, tracked there): `pick_swap`'s original
# strict "> " mutual-benefit rule made equal holdings an absorbing state, so
# goods obtained only via cross-species trade capped near 1 unit per agent.
# The follow-up fix redefines `want` as the deficit below `STOCK_TARGET`
# (agents accumulate a full balanced basket instead of merely equalizing) and
# considers all good-pairs, which let `STOCK_TARGET` go back up to 2.0 — but
# that doubling of raw goods held per agent meant node supply
# (`NODE_START_AMOUNT`) had to come back UP too, not down, to keep pace.
# The basket agents assemble now funds invention LEARNING (see
# `invention::Invention::materials`) rather than gating births; with
# reproduction ungated this scenario's population grows past its founding
# stock within a few hundred ticks (asserted in `tests/trade.rs`).
name = "biome-trade"
seed = 20260719
resources_enabled = true
living_biome = true
max_population = 2000

[[agents]]
count = 320
archetype = "grazer"
placement = { kind = "cluster", center_x = 1008.0, center_y = 696.0, radius = 70.0 }
[agents.traits]
reproduction_threshold = 0.2
size = 0.4

