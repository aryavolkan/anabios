# Territory / habitat / collision showcase (docs/superpowers/specs/
# 2026-09-25-territory-habitat-collision-design.md): three grazer species
# that differ only in their Locomotion gene — land walkers, water swimmers
# (graze aquatic biomass), and flyers, which roam AND feed over land and sea
# (a seabird niche: `Locomotion::can_graze` lets Air graze both terrains
# because a land-only flyer diet starves them out against Land's shared
# forage). Each keeps a species territory; bodies are kept apart (separation
# steering plus a min-gap resolve (up to eight Jacobi passes per tick) — see collision.rs), not
# guaranteed to never touch.
#
# sea_level 0.45 + continentality carve real oceans at the default 1024 world,
# so all three classes have habitat.
#
# Founding: Land founds four habitat herds (`herds = 4`), and Water/Air
# scatter around those SAME herds (`near_spec`, spec 0), so each of the four
# founding sites holds all three classes and every species forms its
# territory out of a shared start rather than three uniformly-scattered,
# spatially disjoint populations. `instantiate` still relocates every founder
# to the nearest valid cell for its own Locomotion class, so the
# near_spec-scattered Water founders land in the coastal sea beside a herd
# and Air founders scatter freely (any terrain is valid for Air). Four herds
# rather than one is a validation-sweep finding (8 seeds x 5000 ticks, with
# the opt-out below): founded as a single 150-strong herd, Land dwindles to
# 15 or fewer on 4/8 seeds and only 4/8 seeds keep every class alive above
# half the founder count; founded over four sites, all three classes
# survive on 8/8.
#
# No `max_share`, and a `max_population` that never binds (2026-09-29): the
# three classes used to race for one shared cap — whichever bred up to it
# first sterilized the other two, so every seed collapsed to a single class
# at alive ≈ max_population and per-lineage shares (0.45/0.35/0.20) had to
# reserve room. Food limits them now: with the cap lifted the world peaks at
# 956 (tick 2800) and holds 800-950 to tick 5000 with Land 395 / Water 333 /
# Air 228 at the peak, so the 1500 cap is a safety budget 1.5x above the
# food-limited peak and the shares are gone (see docs/scenarios.md,
# "Carrying capacity").
#
# Opt-out: `sexual_dimorphism_enabled = false`. This is the one curated
# world that opts out of a default-on subsystem, because dimorphism's female
# mate choice sterilizes the flyers: a female accepts a male only when his
# display quality (Size x (1 + 0.6 x dimorphism gene)) reaches 0.8 x her
# choosiness, and at the neutral gene and choosiness (0.5) the Air founders'
# size 0.3 displays 0.39 against a 0.40 bar — no Air male ever qualifies, so
# Air never breeds and dies out at founder lifespan (tick ~3000-3500) on
# every seed, at any founder count or share. Measured by a one-knob-at-a-time
# ablation of 23 of the 26 default-on knobs (4 seeds x 1500 ticks; not
# covered: `inventions_enabled`, which cannot be turned off alone because
# knowledge requires it, `territory_enabled` and `conserve_goods_on_death`):
# only dimorphism off lets Air breed (to its 300 cap); disease, disasters and
# basic needs off each leave Air at zero births. The validation sweep with
# this opt-out and four Land herds (8 seeds x 5000 ticks, under the shares
# since removed): all three classes alive on 8/8 seeds and all three within
# 1% of their then share caps (675/525/300) on 5/8 (seed 0 ends with Water
# at 52, seed 2 with Land at 317, seed 4 with Land at 654), zero habitat
# violations, territory formation on 8/8. Dimorphism itself is exercised on
# `tribes`. Otherwise the full stack runs (see docs/scenarios.md).
#
# seed = 4 stays the showcase seed (in that sweep all three classes are
# alive at t5000: Water and Air at their caps, Land at 654 of 675). The
# land/air ecology imbalance measured before the schema flip (findings doc,
# post-review table: Land survives 4/8, Water 6/8, Air 7/8 by 20k ticks) is
# an open finding, not fixed here; the candidate follow-up (a flight
# metabolic premium for Air) is not implemented.
name = "habitat-territories"
seed = 4
max_population = 1500
sexual_dimorphism_enabled = false

[climate]
continentality = 0.8
sea_level = 0.45

[[agents]]
count = 150
archetype = "grazer"
placement = { kind = "habitat", herds = 4, radius = 80.0 }
[agents.traits]
locomotion = 0.5
size = 0.5
lifespan_bias = 0.6
reproduction_threshold = 0.5

[[agents]]
count = 100
archetype = "grazer"
placement = { kind = "near_spec", spec = 0, radius = 160.0 }
[agents.traits]
locomotion = 0.1
size = 0.4
lifespan_bias = 0.6
reproduction_threshold = 0.5

[[agents]]
count = 60
archetype = "grazer"
placement = { kind = "near_spec", spec = 0, radius = 120.0 }
[agents.traits]
locomotion = 0.9
size = 0.3
lifespan_bias = 0.6
reproduction_threshold = 0.5
