# A world with subtropical deserts and an equatorial rainforest belt.
#
# Terrain is climate-driven: per cell the generator computes elevation
# (gradient-noise fBm + domain warp), temperature (a raised-cosine latitude
# gradient — hot equator at y=512, cold poles at y=0/1024 — minus an elevation
# lapse), and moisture (latitude bands: wet equator, dry subtropics), then
# classifies via a Whittaker matrix. See
# docs/superpowers/specs/2026-07-27-procgen-worldgen-design.md.
#
# Because deserts (hot + dry subtropics) and rainforest (hot + wet equator) fall
# out of the latitude model, EVERY seed has both — no seed-scouting required.
# Seed 13 just happens to carry generous patches of each; the cluster centers
# below are the densest Desert and Rainforest windows on this seed, reported by
#   cargo run -p anabios-core --example biome_scout
#
#   desert patch     ~ (740, 652)   55% desert     within +/-8 cells
#   rainforest patch ~ (68, 516)    92% rainforest within +/-8 cells  (the equator)
#
# Climate features are on so the two biomes are behaviorally distinct:
#   biome_adaptation - feeding bonus where EnvAffinity matches local temperature
#   terrain_habitat  - agents are pulled toward their TerrainAffinity terrain
#   living_biome     - depleted cells recolonize, keeping the tropics productive
#   season_period    - seasonal regrowth band that migrates with the climate
name = "desert-tropical"
seed = 13
biome_adaptation = true
terrain_habitat = true
living_biome = true
season_period = 400
# Both cohorts thrive on the feeding bonus, so cap the population — otherwise it
# explodes and long runs grind on O(n^2) proximity.
max_population = 2000

# Desert cohort: terrain_affinity in [0.00, 0.25) -> prefers Desert terrain.
[[agents]]
count = 120
placement = { kind = "cluster", center_x = 740.0, center_y = 652.0, radius = 80.0 }
[agents.traits]
terrain_affinity = 0.1
lifespan_bias = 0.6
reproduction_threshold = 0.5

# Tropical cohort: terrain_affinity in [0.50, 0.75) -> prefers forest/rainforest.
[[agents]]
count = 120
placement = { kind = "cluster", center_x = 68.0, center_y = 516.0, radius = 80.0 }
[agents.traits]
terrain_affinity = 0.6
lifespan_bias = 0.6
reproduction_threshold = 0.5
