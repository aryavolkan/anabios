# Minimal: a single archetype-free lineage scattered uniformly. The fast
# smoke scenario the golden-hash determinism test pins on. Runs the full
# stack (see docs/scenarios.md); opt-outs: none.
name = "minimal"
seed = 12345
# Pin the cap so the golden-hash determinism test stays fast and stable.
max_population = 2500

[[agents]]
count = 200
placement = { kind = "uniform" }

[agents.traits]
size = 0.4
basal_metabolism = 0.4
lifespan_bias = 0.6
reproduction_threshold = 0.5
