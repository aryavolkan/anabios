name = "out-of-africa-saga"
seed = 318

# OUT OF AFRICA — THE SAGA (EXPERIMENT — documented NEGATIVE result).
#
# This was an attempt to make the grand `out-of-africa` world reach the era-3
# milestones (Writing, Husbandry) and domesticate the herds inside ONE
# full-scale run, by borrowing `domestication.toml`'s recipe: throttle the
# population (max_population = 900) so "the tech race, not Malthusian collapse,
# dominates", boost + co-locate the innovators with a tameable Quarry herd, and
# keep every subsystem and the grand geography.
#
# IT DID NOT WORK. Measured (seed 318, 20k ticks): the throttle STARVED the
# material economy — MaterialLearning dropped from 213 (base) to 0 and the world
# discovered NO inventions at all, worse than the base (which at least reaches
# Fire). Invention discovery is gated on gathering + spending material baskets,
# which needs population; a naive throttle removes the very economy the climb
# depends on. See docs/showcase-plan.md §2/§4 for the full analysis.
#
# Retained as the honest starting point for "Option C" (tune a focused saga) and
# as evidence that population throttling is the WRONG lever. This is NOT the
# showcase scenario — the recommended path is a `starting_inventions` seeding
# feature (Option A) or a two-act showcase (Option B). Do not treat this file as
# a working demo.
#
# Watch: Migration / CorridorUse / RangeExpansion (the trek);
# InventionDiscovered up the tech tree incl. Writing (the technology arc);
# AnimalDomesticated / LivestockHerd (the finale); SexualSelection on the
# hominid lineages.

max_population = 900

env_period = 400
climate_drift_rate = 0.00005
season_period = 2000
biome_adaptation = true
living_biome = true
nutrient_variation = true
soil_fertility = true
disasters_enabled = true
terrain_habitat = true
resources_enabled = true
settlement_enabled = true
inventions_enabled = true
gene_tech_coupling = true
cognition_enabled = true
war_enabled = true
sexual_dimorphism_enabled = true
domestication_enabled = true

