# ---------------------------------------------------------------------------
# EURASIA — the north is held only by ARCHAICS: economically marginal
# lineages with no local obsidian and no invention temperaments, plus wild
# steppe herds and cave-bear bruisers. Spread from NW Europe through the
# Caucasus/Central-Asian steppe to NE Asia/Siberia — deliberately left empty
# of economic lineages in between: the first migrant culture to cross and
# settle founds the north. Land-verified: all centers LAND, disk samples
# 98-100% land.
# ---------------------------------------------------------------------------

# NW archaic hunter-gatherers (NW Europe, lat 50, lon 10): cold, pre-economic.
[[agents]]
count = 60
archetype = "asocial_forager"
placement = { kind = "geo", lat = 50.0, lon = 10.0, radius = 100.0 }
[agents.traits]
lifespan_bias = 1.0
