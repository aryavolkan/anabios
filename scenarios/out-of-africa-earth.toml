name = "out-of-africa-earth"
seed = 318

# OUT OF AFRICA — REAL EARTH. The full out-of-africa subsystem stack on a real
# Earth map (world_map = "earth"): real elevation + temperature + precipitation
# rasters (assets/earth/, built by scripts/build_earth_map.py) drive the biome
# field through the existing Whittaker classify(). Founding lineages are placed
# on real coordinates with `geo`: the cognitive cradle in equatorial East
# Africa, archaics across Eurasia. The dispersal funnels through the real
# African exits (Sinai / Bab-el-Mandeb, Gibraltar). Equirectangular; E-W wraps
# (dateline), poles are ice at the y-edges.
#
# This is `out-of-africa.toml`'s population and lineage composition (same
# counts, same traits) re-anchored from the procedural grand-theater map onto
# real coordinates — the two scenarios differ ONLY in geography. Placements
# were land-verified against assets/earth/elevation.u8 before landing (every
# cluster center is LAND; each cluster disk sampled >=78% land, most >=90%).
#
#   AFRICA — the Cradle (equatorial East Africa, lat 0.5 / lon 37: Kenya/
#   Ethiopia highlands) carries the founding foragers, the traditionalists,
#   cultural foragers and the sentinel. The QUARRY sits just east (lat 0.5 /
#   lon 38.5) with the innovators. The MEGAFAUNA BELT is East African savanna
#   (lat -2 to -3 / lon 34.5-35.7): grazer/herd/stalker/spiner/bruiser/
#   pack_hunter plus the two cultural-hunter packs. The SAHEL RELAY sits in
#   North Africa (lat 13-14.5 / lon 8-12), the RAINFOREST commune in the
#   Congo basin (lat 1 / lon 21), and the CAPE in South Africa (lat -32.5 to
#   -33.5 / lon 21-23). A marker territory watches the EAST STRAIT from the
#   Arabian peninsula (lat 20 / lon 45).
#
#   EURASIA — held only by ARCHAICS, spread from NW Europe (lat 50 / lon 10)
#   through the Caucasus/Central-Asian steppe (lat 45-50 / lon 35-75) to NE
#   Asia / Siberia (lat 55 / lon 105), plus the northern megafauna herds and
#   cave-bear bruisers riding the same corridor.
#
# The exodus is emergent, not scripted: agents forage, trade, and settle their
# way out through the real African corridors (Sinai/Bab-el-Mandeb toward
# Arabia, Gibraltar toward Iberia) under the same DIT/cognition/war/
# domestication stack as `out-of-africa.toml`. Watch Migration /
# CorridorUse / RangeExpansion / SpeciationEvent for the trek,
# MaterialLearning / InventionDiscovered / AnimalDomesticated for the
# technology arc, and SexualSelection on the hominid lineages.
#
# Honest expectations (measured, release, seed 318, 2000 ticks via `run
# --events-jsonl`: alive=998, state_hash=0xa3a859978b896fb1). Watchable at
# grand scale (max_population 3000, biome_res 256, world_size 4096, every
# subsystem on) on the real Earth map. The exodus IS real: Migration fires
# 733x and CorridorUse 134x (the human dispersal through the real African
# exits), amid heavy churn (2220 PopulationCrash, 1945 SpeciationEvent,
# 1430 Extinction). But the technology arc STALLS: zero InventionDiscovered
# / MaterialLearning / AnimalDomesticated in 2000 ticks — every species era 0.
#
# This scenario does NOT seed `starting_inventions`; Stone Tools et al. must
# emerge. Sub-project B investigated whether they can (see
# docs/superpowers/specs/2026-08-11-ooa-earth-emergence-probe-findings.md).
# Result: NO. The elevation normalization was re-tuned so the real map now
# has Rock/obsidian in the East African Rift (~23 units from the cradle) —
# without it, `stone_tools` (needs obsidian) was materially impossible. But
# even with obsidian reachable, the r-selected asocial_forager competitively
# excludes the innovator lineage (40 -> ~3 by tick 2000) before it can bank
# the materials to discover — the same ecological-exclusion wall documented
# on the procedural map, which single-knob map/placement tuning does not
# crack. Emergent era-3 ("inventions completed") is not reachable here; the
# seeded `out-of-africa-saga` remains the honest showcase for the full
# completed tech arc.

max_population = 3000
world_size = 4096.0
biome_res = 256
hash_res = 256
world_map = "earth"

env_period = 400
climate_drift_rate = 0.00005
season_period = 2000
biome_adaptation = true
living_biome = true
nutrient_variation = true
soil_fertility = true
disasters_enabled = true
terrain_habitat = true
resources_enabled = true
settlement_enabled = true
inventions_enabled = true
gene_tech_coupling = true
cognition_enabled = true
war_enabled = true
sexual_dimorphism_enabled = true
domestication_enabled = true

