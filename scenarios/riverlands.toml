# A continent-scale grazing world that sites itself. Runs the full stack (see
# docs/scenarios.md); opt-outs: none. Absorbed: continental.
#
# Geography: `continentality` pulls the land into a few masses, `mountain_uplift`
# raises ridged ranges, `rain_shadow` dries their lee slopes, and the hydrology
# pass carves a river network down the elevation field (`river_threshold`).
#
# CAUTION on `river_threshold`: it thresholds a flow accumulation counted in
# *upstream cells*, so it is meaningless without its `biome_res`. 150 at
# biome_res 512 (here) carves ~1% of the map into river; the same 150 at
# biome_res 128 carves five cells in the whole world. Run `cargo run
# --release -p anabios-core --example river_scaling` before copying this
# block into a world of a different scale.
#
# Population: unlike the absorbed continental founder cohort below — whose
# cluster center is a pair of coordinates recovered by a manual
# densest-patch scout, and therefore only correct for its one seed — the
# herds here are placed by `kind = "habitat"`, which reads the generated
# field and anchors them on vegetated ground within reach of drinkable
# water. The predators then take `kind = "near_spec"` to find the herds
# wherever the terrain put them. Nothing here is seed-specific, so
# re-seeding relocates the whole ecology instead of breaking it.
name = "riverlands"
seed = 7
world_size = 4096.0
biome_res = 512
hash_res = 256
# Tick cost tracks live agent count far more than grid size, so a big world
# with a moderate cap stays cheap: this runs faster per tick than the default
# 1024² predator-prey scenario, which caps at 2000.
max_population = 2500
season_period = 3000
# Thirst is on by default, which is what makes the water-aware siting
# load-bearing: `habitat` anchors are chosen with the same `drinkable_cell`
# predicate the thirst drive uses, so a herd starts where it can actually
# drink. A cohort stranded beyond the 96-unit water scan never finds water
# and pays up to 4x basal metabolism until it starves.
#
# Mate-seeking is on by default too. The pack is sparse: 80 hunters over a
# 4096² map. Mating is contact-range and `Mate` alone moves nobody, so
# without it a fed pack with room under the cap still never breeds (measured:
# births stop once the founders leave their seeding cluster). A mating
# hunter that sees no pack-mate steers toward the nearest one within 96
# units.

[climate]
continentality = 0.85
mountain_uplift = 0.6
rain_shadow = 0.4
river_threshold = 150.0
sea_level = 0.45

# Grazers: eight herds auto-sited on watered forage. `max_water_dist = 48`
# keeps every anchor inside the thirst drive's 96-unit water scan even after
# the 110-unit scatter pulls a straggler off the anchor.
#
# No `max_share` (2026-09-29): the shares reserved birth slots under a
# population cap the herds filled by tick ~200, after which no predator could
# be born (measured then: predators 80 → 0 by tick 4000 without the share, at
# every cap size up to 30000, as the herds ate the biome to zero). Food limits
# the world now (growth, gestation, the chase and its carcass economy): with
# the cap lifted it peaks at 1619 (tick 4900) with the herds at 400-440 and
# the pack at 45-112 through 5000 ticks, so the 2500 cap is a safety budget
# 1.5x above the food-limited peak. The history below records how the shares
# were tuned. Reserving 80% for the herds
# leaves the pack the rest.
[[agents]]
count = 560
archetype = "mammal_grazer"
placement = { kind = "habitat", herds = 8, radius = 110.0, max_water_dist = 48.0 }
[agents.traits]
size = 0.45
# Low mutation keeps the prey species coherent enough to keep interbreeding.
# Hyper-speciated prey stop mating, grow fat, and — since energy is hit points
# — become unkillable, which starves every predator in the world.
mutation_rate = 0.3
lifespan_bias = 1.0

# Predators: seeded onto the herds themselves. `mammal_pursuer` (not
# `stalker`) because the founder `predator_kit` carries no Reproductive
# module and so dies out sterile; the pursuer kit breeds, and its 0.95 top
# speed is set against the grazer's 0.55 so a chase can actually close.
#
# The three numbers below were swept, not guessed (35 runs over seeds 7, 11,
# 23). The pack has an Allee floor near ten hunters: below it, even with
# mate seeking, the survivors sit further apart than the 96-unit scan and
# the lineage fades. A founder pack of 80 at radius 90 dipped under that
# floor on two of three seeds. 120 at radius 50 starts dense enough to clear
# the founder dip on every seed. A `max_share` of 0.15 then capped the pack
# at 375: without a ceiling it boomed past what the herds could feed (200+
# by t500), starved back to ~15, and faded. With it the pack saturated and
# held — 372-375 on all three seeds at t6000, still there at t9000. (Under
# the chase's carcass economy the pack no longer needs the ceiling: 45-112
# through 5000 ticks with no share at all.)
# Raising `reproduction_threshold` to damp the boom instead was the one
# change that reliably killed the pack (it pushed seed 11 under the floor).
[[agents]]
count = 120
archetype = "mammal_pursuer"
placement = { kind = "near_spec", spec = 0, radius = 50.0 }
[agents.traits]
size = 0.65
# Ranging hunters drink less often than the herds they follow.
thirst_tolerance = 0.7
# Lower than the grazers' default so the pack can replace combat losses.
reproduction_threshold = 0.4
lifespan_bias = 1.0

# Absorbed from continental.toml: a small founder cohort on the same
# river-adjacent forest its densest-patch scout found (cluster center from
# BiomeField::generate_with(7, 512, 4096.0, this file's climate), a
# 100%-Forest window with the nearest river cell ~91 units away). It once
# held the last 5% share after the herds (80%) and the pack (15%); with the
# shares gone it competes for food like the rest (1074 of the 1619 peak).
[[agents]]
count = 120
placement = { kind = "cluster", center_x = 1492.0, center_y = 1020.0, radius = 120.0 }
[agents.traits]
lifespan_bias = 0.6
reproduction_threshold = 0.5
