name = "o3-ooa-rb-trade"
seed = 318

# OUT OF AFRICA: a grand-theater-scale world themed on the human dispersal —
# one tropical founding continent, a mid-map sea with two desert crossings,
# a temperate northern world held only by archaics, and every opt-in
# subsystem switched on:
#
#   * Grand-theater full stack: living biome + seasonal band (season_period) +
#     secular drift (climate_drift_rate) + DIT optimum sweep (env_period) +
#     nutrient variation + soil fertility + disasters + terrain-habitat
#     sorting + the four-goods material economy (trade goods gate — and are
#     consumed by — invention LEARNING, not births) + settlement anchoring +
#     invention tree + gene<->tech coupling + cognition (IQ/practices) +
#     war substrate.
#   * PLUS the two flags grand-theater omits: sexual_dimorphism (binary sex,
#     female mate choice on the hominid lineages) and domestication
#     (Husbandry holders tame the wild grazer herds into livestock).
#
# Geography (seed 318, climate-driven worldgen; probed with
# examples/africa_scout + site_probe). The latitude engine gives a real
# Earth-like layout: hot equator at y~=512, poles at both y-edges (the
# torus seam is the polar route). An ocean belt crosses the map at
# y = 320-416 — up to ~600 units of unbroken sea in the middle — with
# exactly two desert crossings: the WEST ISTHMUS at x = 40-64 and the EAST
# STRAIT at x = 672-704 (both ~55% desert, the Sahara reading). CorridorUse
# fires when migrations funnel through either.
#
#   AFRICA (south of the sea, y > 416): the equatorial continent. The Cradle
#   hub (150,440) grows ALL FOUR GOODS locally (savanna 34% / rainforest 33%
#   / rock 16% / desert 9%); the obsidian QUARRY (240,430: rock 45% /
#   savanna 50%) sits next door. The savanna megafauna belt runs at
#   (200,620); the mixed Sahel relay (500,680) is the second four-goods
#   junction; the Cape (200,800) cools into taiga/forest.
#
#   EURASIA (north of the sea, y < 320): cold taiga/forest highlands held
#   only by ARCHAICS — NW taiga foragers (250,150), eastern archaics
#   (690,250), a NE dialect commune (800,180), taiga herds (500,220) and
#   cave-bear bruisers. The rich west highlands (90,240: rock 63%) and the
#   forest/taiga borders are left EMPTY of economic lineages: the first
#   migrant culture to cross and settle founds the north.
#
# The exodus is emergent, not scripted: the seasonal band migrates through
# the belt, drift never stationarizes, disasters scar the south — and the
# migrants are pushed and pulled across the crossings by forage, trade
# goods, and settlement anchors. Watch Migration / CorridorUse /
# RangeExpansion / SpeciationEvent for the trek, MaterialLearning /
# InventionDiscovered / AnimalDomesticated for the technology arc, and
# SexualSelection on the hominid lineages.
#
# Honest expectations (measured on this build): with births ungated the
# world TEEMS and churns — population crests the cap early, then the sea and
# the stressors hold it ~1.9k at 4k ticks, with thousands of migrations,
# speciations, and extinctions along the way. Settlements and markets
# crystallize on both continents by ~400. The exodus fires early and often:
# CorridorUse lands north of the sea from tick ~1000 through BOTH crossings
# (west x~80-235, east x~805-950), with 600+ corridor events over 4k ticks.
# The technology arc is economic: Stone Tools is discovered at the QUARRY at
# tick 797 and species-adopted 18 ticks later; Fire follows at 2086 — and
# every one of the 203 adoptions by 4k is paid for in goods
# (MaterialLearning). Which lineage holds Eurasia longest, and whether the
# archaics persist or are absorbed, plays out inside the churn. Run 2-4k
# ticks for the full theater.

max_population = 3000

env_period = 400
climate_drift_rate = 0.00005
season_period = 2000
biome_adaptation = true
living_biome = true
nutrient_variation = true
soil_fertility = true
disasters_enabled = true
terrain_habitat = true
resources_enabled = true
settlement_enabled = true
inventions_enabled = true
gene_tech_coupling = true
cognition_enabled = true
war_enabled = true
sexual_dimorphism_enabled = true
domestication_enabled = true

# O3 era-climb probe: the one-variable repro-bias variant of the grand run.
repro_biased_learning = true
unilateral_trade = true
conserve_goods_on_death = true

# ---------------------------------------------------------------------------
# THE CRADLE — equatorial African hub (150,440). All four goods grow locally
# (savanna 34% / rainforest 33% / rock 16% / desert 9%): the trade quartet
# sorts onto terrain borders (terrain_habitat), anchors settlements, and
# stocks the material economy. (Note: the spice/amber quarters pull toward
# Grass/Forest proper — savanna and rainforest feed their GOODS but the
# habitat pull targets the home terrains, so those quarters work the pockets
# and borders rather than the broad belts.)
# ---------------------------------------------------------------------------

[[agents]]
count = 220
archetype = "asocial_forager"
placement = { kind = "cluster", center_x = 150.0, center_y = 440.0, radius = 110.0 }
[agents.traits]
reproduction_threshold = 0.2
terrain_affinity = 0.12

