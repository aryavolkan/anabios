name = "vast-steppe"
seed = 22
world_size = 16384.0
biome_res = 2048
hash_res = 1024
living_biome = true
season_period = 7000
max_population = 6000
biome_step_interval = 4

# Phase-1 "Vast" scale tier (docs/superpowers/specs/2026-09-12-pixel-world-at-scale-design.md,
# steps 5-6): a 16384^2 world (biome grid 2048^2, spatial hash 1024^2) — one tier past
# `scenarios/huge-steppe.toml`, same living-biome + seasonal-regrowth mix and 6k population
# budget. At this resolution recomputing the whole 2048^2 biome grid every
# `tick::BIOME_STEP_INTERVAL` (10) ticks starts to dominate tick time, so this scenario opts
# into `biome_step_interval = 4`: the regrow/recolonize/seasonal-regrow/resource-spawn block
# runs 4x less often (every 40 ticks) in exchange for regrowth *resolution* — an acceptable
# trade at this scale, since a 2048^2 grid barely moves cell-to-cell over 40 ticks anyway.
# Archived under experiments/ alongside sandbox-xlarge: a stress/throughput probe, not a
# curated phenomenon demo.

# Same uniform herbivore + communicator mix as huge-steppe, at vast-steppe scale.
[[agents]]
count = 1500
placement = { kind = "uniform" }
archetype = "grazer"

[[agents]]
count = 30
placement = { kind = "uniform" }
archetype = "communicator"
