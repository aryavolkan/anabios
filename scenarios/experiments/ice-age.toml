name = "ice-age"
seed = 0
# Cap living agents so the windowed viewer stays fluent (default is 10000).
max_population = 2000

# CLIMATE KNOB showcase: ICE AGE. `temp_bias = -0.22` drags every cell's
# temperature down before Whittaker classification, so the taiga/tundra belt
# swallows the temperate mid-latitudes and only the equatorial band stays
# warm. Two grazer stocks start at different latitudes: the equatorial herd
# keeps rich forage, the mid-latitude herd is stranded in the cold. With
# biome_adaptation on, climate affinity decides who eats. Prediction:
# RangeExpansion toward the equator and SegregationEmerged as the ranges
# sort by climate match. The slow drift keeps the target moving.
biome_adaptation = true
env_period = 600
climate_drift_rate = 0.00003

[climate]
temp_bias = -0.22

# Equatorial founders: warm-adapted grazers on the last green belt.
[[agents]]
count = 80
archetype = "grazer"
placement = { kind = "cluster", center_x = 512.0, center_y = 512.0, radius = 120.0 }
[agents.traits]
lifespan_bias = 1.0
reproduction_threshold = 0.4

# High-latitude founders: same stock, dropped into the frozen north.
[[agents]]
count = 80
archetype = "grazer"
placement = { kind = "cluster", center_x = 512.0, center_y = 130.0, radius = 100.0 }
[agents.traits]
lifespan_bias = 1.0
reproduction_threshold = 0.4
