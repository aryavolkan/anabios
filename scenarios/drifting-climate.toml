name = "drifting-climate"
seed = 0

# E10 showcase: DRIFTING CLIMATE. The DIT env-variability optimum sweeps
# seasonally (env_period = 400 → a full triangle cycle every 800 ticks), and on
# top of it a slow SECULAR drift wanders the optimum's baseline up and down over
# a ~125k-tick super-cycle (climate_drift_rate = 0.00005 rad/tick). Unlike the
# bounded seasonal wave, the drift never lets the environment stationarize: a
# fixed genetic technique that was well-matched 50k ticks ago is stranded as the
# baseline moves out from under it. Prediction: cultural trackers (learn + copy)
# keep pace with the moving target, while the innate strategy's technique-match
# decays as the climate drifts — selection pressure that never settles.
env_period = 400
climate_drift_rate = 0.00005

# Genetic strategy: fixed innate technique, evolves only across generations.
[[agents]]
count = 60
archetype = "innate_forager"
placement = { kind = "cluster", center_x = 512.0, center_y = 512.0, radius = 80.0 }
[agents.traits]
lifespan_bias = 1.0
reproduction_threshold = 0.3

# Cultural strategy: learns the technique by doing AND copies well-matched
# neighbours — stays current as both the season and the climate baseline shift.
[[agents]]
count = 60
archetype = "critical_learner"
placement = { kind = "cluster", center_x = 512.0, center_y = 512.0, radius = 80.0 }
[agents.traits]
lifespan_bias = 1.0
reproduction_threshold = 0.3
