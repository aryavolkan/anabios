name = "grand-theater"
seed = 424242

# GRAND THEATER: every opt-in subsystem switched on at once, in one shared
# world, with the cast placed so the subsystems collide instead of running in
# isolation. One run exercises, in combination:
#
#   * Environment: living biome + seasonal regrowth band (season_period) +
#     secular climate drift (climate_drift_rate) on top of the DIT seasonal
#     optimum sweep (env_period) + nutrient variation + soil fertility.
#   * Disturbance: disasters (fire/drought/freeze scars) against the living,
#     drifting, seasonal biome.
#   * Gene–culture: cognition (realized IQ) + invention tree + gene↔tech
#     coupling, so adoption selects the genome while the genome gates
#     discovery — under a climate that never stationarizes.
#   * Economy: resource goods + terrain-habitat sorting + home-range
#     settlement anchoring + the material learning economy (trade goods
#     gate — and are consumed by — invention discovery and adoption; births
#     are NOT goods-gated — the economy funds culture, not reproduction).
#   * Conflict: war substrate (SenseHostility in the mutation pool) + three
#     weapon systems (contact Weapon, ranged Spines, heavy Jaws) + armed
#     cultural hunters in Metalworking diffusion range of the tech commune.
#   * Communication: dialect divergence, pheromone territories, alarm-call
#     prey, kin-cooperation lineages, the four DIT learning strategies.
#
# Geography (seed 424242 = the proven geographic-trade terrain, probed):
# obsidian/rock is the bottleneck good (~0.3% of the map), so only two sites
# grow all four goods locally: the NORTH-SEAM HUB (948,4 — the tuned
# geographic-trade junction: grass .41 forest .35 desert .21 rock .03) and
# the SOUTH JUNCTION (544,760: grass .35 forest .13 desert .40 rock .01).
# The two persistent settlements sit there; the predator arena at map center
# is far enough away that the packs hunt the herds, not the marketplace; the
# DIT arena and frontier colonies (dialect communes, marker territories) are
# economically marginal outposts running on founder stock.
#
# Honest expectations (measured on this build): with births ungated the
# world TEEMS — the population rides the 3000 cap and churns (thousands of
# migrations/speciations/extinctions over 3k ticks; CorridorUse ~90,
# markets ~96). Every detector class fires: settlements, specialization
# splits, wars and alliances, dialects, territories, alarm calls, practice
# flare-ups, maladaptation lag, kin networks, succession — and the economy
# visibly funds culture: the tech commune climbs the tree (3 discoveries
# and 3 species-level adoptions by 3k) with 84 MaterialLearning spends as
# each new holder pays the goods basket for its era-1/2 tech. Run 1.5-3k
# ticks for the full theater; the scoreboard is which lineage holds the
# most of the tree while the world churns around the cap.

max_population = 3000

env_period = 400
climate_drift_rate = 0.00005
season_period = 2000
biome_adaptation = true
living_biome = true
nutrient_variation = true
soil_fertility = true
disasters_enabled = true
terrain_habitat = true
resources_enabled = true
settlement_enabled = true
inventions_enabled = true
gene_tech_coupling = true
cognition_enabled = true
war_enabled = true

