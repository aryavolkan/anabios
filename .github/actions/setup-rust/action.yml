name: setup-rust
description: >
  Install the stable Rust toolchain, restore the cargo cache, and optionally
  install the cargo subcommands a job needs. Every Rust job in ci.yml shares
  this, so toolchain/cache/tooling choices live in one place.

inputs:
  components:
    description: 'Extra rustup components, comma-separated (e.g. "rustfmt, clippy").'
    required: false
    default: ""
  nextest:
    description: 'Install cargo-nextest ("true"/"false").'
    required: false
    default: "false"
  coverage:
    description: 'Install cargo-llvm-cov and llvm-tools-preview ("true"/"false").'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.coverage == 'true' && format('llvm-tools-preview,{0}', inputs.components) || inputs.components }}
    - uses: taiki-e/install-action@nextest
      if: inputs.nextest == 'true'
    - uses: taiki-e/install-action@cargo-llvm-cov
      if: inputs.coverage == 'true'
    # Cache last: it keys off the resolved toolchain installed above.
    - uses: Swatinem/rust-cache@v2
