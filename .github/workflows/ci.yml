name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps --document-private-items
      - name: test (lib + unit)
        run: cargo test --workspace --lib
      # Integration tests are NOT run here. They were a 15-minute debug-profile
      # simulation run whose every test also runs — in release, parallelized —
      # in the `emergence` job below (no test is debug-only), so the debug run
      # was pure redundancy. clippy --all-targets above still compile-checks the
      # integration binaries on both OSes; the doctests below still run in debug.
      - name: test (doc tests)
        run: cargo test --workspace --doc
      - name: bench compile check
        run: cargo bench --workspace --no-run

  # The integration + behavioural gate, in release so the emergence detectors
  # (M11-M15) — `#[cfg_attr(debug_assertions, ignore)]`, hence skipped in any
  # debug run — actually execute. A handful of those detectors each run a
  # multi-seed simulation and dominate wall-time (predator_prey ~405s,
  # cooperation ~326s, dimorphism ~177s), so a single job ran ~16 min. We shard
  # by binary so the two biggest detectors never share a runner:
  #   - `predation`:    predator_prey_emergence alone (the tallest pole, ~7 min).
  #   - `cooperation`:  cooperation_emergence + dimorphism.
  #   - `rest`:         everything else — the remaining detectors (domestication,
  #     knowledge, …) + the whole lib/integration suite.
  # The three filtersets are a complete, disjoint partition (the third is the
  # negation of the first two), so every test still runs exactly once; all shards
  # must pass. The `emergence (release)` job below fans them in so the gate keeps
  # its single check name. (Unconditionally-#[ignore]d experiment harnesses in
  # gene_culture.rs / dit_boundary.rs stay skipped — analysis tools, not gates.)
  emergence-shard:
    name: emergence shard (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: predation
            filter: "binary(=predator_prey_emergence)"
          - id: cooperation
            filter: "binary(=cooperation_emergence) | binary(=dimorphism)"
          - id: rest
            filter: "not (binary(=predator_prey_emergence) | binary(=cooperation_emergence) | binary(=dimorphism))"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: test (release) — shard ${{ matrix.id }}
        run: cargo nextest run --workspace --release -E "${{ matrix.filter }}"

  # Fan-in: keeps a single `emergence (release)` status check (matching the name
  # branch protection may require) and fails if any shard failed. `if: always()`
  # so it runs even when a shard fails (a failed `needs` otherwise just skips it).
  emergence:
    name: emergence (release)
    needs: emergence-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all emergence shards passed
        run: |
          result='${{ needs.emergence-shard.result }}'
          echo "emergence-shard matrix result: $result"
          [ "$result" = "success" ] || { echo "::error::an emergence shard did not pass"; exit 1; }

  # Coverage is collected in parallel shards, then unioned in the `coverage` job
  # below. Instrumented execution of the full suite had grown to ~20 min in a
  # single job. The cost is NOT spread evenly across tests: a handful of
  # simulation-heavy integration tests explode under LLVM instrumentation (the
  # same tests stay fast in release — see the `emergence` job), and they
  # parallelize poorly (long CPU-bound sims with serial tails), so a naive
  # count split just clusters them into one unlucky shard. We bin-pack instead:
  #   - `scenarios`:  `all_scenarios` alone — its one test runs every scenario
  #     back-to-back and is the single tallest pole (~5 min even by itself).
  #   - `behavioral`: `traditions` (one ~370s test) + `invariants` (many mid-
  #     weight tests that parallelize) — ~6 min.
  #   - `bulk-1..3`:  everything else + the whole lib/unit suite, count-partitioned
  #     3 ways (nextest -E <filter> --partition). Once the tall poles above are
  #     carved out, the remainder is uniform enough that round-robin balances it
  #     (~5-7 min each) instead of piling into one 16-min shard.
  # The five filtersets are a complete, disjoint partition (the three bulk shards
  # exhaust `not (scenarios | behavioral)`), so their union is the full workspace
  # coverage. If a binary is renamed it just falls into `bulk` — coverage stays
  # correct, only the balance drifts (and the gate catches any real coverage loss).
  # Rebalance if a new heavyweight lands: give it its own shard like the poles.
  coverage-collect:
    name: coverage shard (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: scenarios
            filter: "binary(=all_scenarios)"
            partition: ""
          - id: behavioral
            filter: "binary(=traditions) | binary(=invariants)"
            partition: ""
          - id: bulk-1
            filter: "not (binary(=all_scenarios) | binary(=traditions) | binary(=invariants))"
            partition: "--partition count:1/3"
          - id: bulk-2
            filter: "not (binary(=all_scenarios) | binary(=traditions) | binary(=invariants))"
            partition: "--partition count:2/3"
          - id: bulk-3
            filter: "not (binary(=all_scenarios) | binary(=traditions) | binary(=invariants))"
            partition: "--partition count:3/3"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # Instrument the workspace once (build is cached), then run only this
      # shard's slice of the test set (nextest -E filterset, optionally count-
      # partitioned). --lcov emits a SELF-CONTAINED tracefile (this shard's own
      # binaries + profile), so the report job can union the shards WITHOUT any
      # cross-machine profraw/binary matching. Coverage reflects the always-on
      # lib + integration suite; doctests aren't measured (nextest doesn't run
      # them) and the emergence detectors run in debug here, where #[ignore]d.
      - name: collect coverage (shard ${{ matrix.id }})
        run: cargo llvm-cov nextest --workspace -E "${{ matrix.filter }}" ${{ matrix.partition }} --lcov --output-path lcov-${{ matrix.id }}.info
      - name: upload shard tracefile
        uses: actions/upload-artifact@v7
        with:
          name: lcov-shard-${{ matrix.id }}
          path: lcov-${{ matrix.id }}.info
          if-no-files-found: error

  coverage:
    name: coverage
    needs: coverage-collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: download shard tracefiles
        uses: actions/download-artifact@v8
        with:
          pattern: lcov-shard-*
          path: shards
          merge-multiple: true
      # Union the partitions' per-line hits and enforce the floors in one pass.
      # A line counts as covered if ANY shard executed it. Pure awk over the lcov
      # DA records — no lcov CLI — so the gate is independent of tool version. The
      # two floors mirror the previous single-job gates (workspace >= 82%, core
      # >= 95% excluding the Godot/CLI crates). Raise these floors when coverage
      # climbs; never lower them silently.
      - name: gate — line coverage floors (workspace >= 82%, anabios-core >= 95%)
        run: awk -v wmin=82 -v cmin=95 -f .github/scripts/lcov-line-gate.awk shards/*.info
      # Machine-readable tracefiles for humans/tools (Codecov, editors). Not a
      # gate; runs even when the gate above fails so the artifacts are available
      # to debug.
      - name: upload lcov artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: shards
          if-no-files-found: warn

  determinism:
    name: determinism smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The golden state hashes are pinned to bit-identical values across OSes
      # (transcendentals are routed through libm/mathf precisely so macOS and
      # Linux agree). That claim is only meaningful if it is actually run on
      # both, so gate the golden-hash + parallel-vs-serial determinism tests on
      # the matrix, in release (the profile the hashes are validated in).
      - name: golden-hash + parallel determinism (cross-OS)
        run: cargo test -p anabios-core --release --test determinism
      # Run-to-run smoke: the headless binary must produce identical output on
      # two independent runs of the same seed. Reuses the release build above.
      - name: build release headless
        run: cargo build --release -p anabios-headless
      - name: run twice and diff
        run: |
          set -euo pipefail
          a=$(./target/release/anabios-headless run --scenario scenarios/minimal.toml --ticks 1000 | tail -n 1)
          b=$(./target/release/anabios-headless run --scenario scenarios/minimal.toml --ticks 1000 | tail -n 1)
          echo "a=$a"
          echo "b=$b"
          [ "$a" = "$b" ] || (echo "non-deterministic output" && exit 1)

  godot:
    name: godot viewer (headless smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Godot viewer is a gdextension backed by the `anabios-godot` crate.
      # Nothing else in CI actually builds or loads it — clippy only
      # compile-checks the crate and the coverage job excludes it — so a broken
      # gdext binding or a scene/script regression ships undetected today. Build
      # the cdylib the `.gdextension` loads (its linux entry points at
      # target/debug/libanabios_godot.so), then load the scenes headless.
      - name: build gdext cdylib
        run: cargo build -p anabios-godot
      # Headless `godot` binary on PATH. Keep the version aligned with the
      # viewer's target engine (game/project.godot / compatibility_minimum).
      - name: install Godot
        uses: lihop/setup-godot@v2
        with:
          version: 4.7.1-stable
      # Import so `.godot/` exists (git-ignored): it holds `extension_list.cfg`
      # — which the runtime reads to load the gdextension — and the imported
      # assets. `--import` runs the editor; on a GPU-less runner the editor GUI
      # SIGABRTs under software (llvmpipe) Vulkan *after* import + extension
      # registration complete, so tolerate a non-zero exit and assert the cache
      # instead. (Belt-and-suspenders: write extension_list.cfg if the crash
      # happened before Godot flushed it.)
      - name: import project (headless)
        run: |
          godot --headless --path game --import || true
          mkdir -p game/.godot
          grep -q 'anabios.gdextension' game/.godot/extension_list.cfg 2>/dev/null \
            || echo 'res://anabios.gdextension' > game/.godot/extension_list.cfg
          echo "extension_list.cfg:"; cat game/.godot/extension_list.cfg
      # Scene-load smoke: open each scene headless for a few frames and fail on
      # any script error or a gdextension load failure. The `dummy` rendering
      # driver avoids creating a Vulkan device (so no llvmpipe crash on the
      # runner); the gdextension still loads from extension_list.cfg. Validated
      # locally against Godot 4.7.1 — both scenes load with godot-rust
      # initialized and zero SCRIPT ERROR.
      - name: scene-load smoke (menu + sim)
        run: |
          rc=0
          for scene in res://scenes/menu.tscn res://scenes/main.tscn; do
            echo "== smoke: $scene =="
            log=$(mktemp)
            if ! godot --headless --rendering-driver dummy --path game "$scene" --quit-after 120 >"$log" 2>&1; then
              echo "::error::godot exited non-zero loading $scene"
              rc=1
            fi
            cat "$log"
            if grep -qE "SCRIPT ERROR|Can't open dynamic library|Failed to load GDExtension|Cannot open library" "$log"; then
              echo "::error::viewer smoke found errors loading $scene"
              rc=1
            fi
            # Positive check: the gdextension must actually initialize, else a
            # silently-unloaded extension (e.g. on a scene that doesn't call
            # into Rust) would pass on absence-of-errors alone.
            if ! grep -q "Initialize godot-rust" "$log"; then
              echo "::error::gdextension did not initialize for $scene"
              rc=1
            fi
          done
          exit $rc
      # GDScript lint/format gate (gdtoolkit — the clippy/rustfmt analog for
      # GDScript). `gdformat --check` enforces formatting/width; `gdlint`
      # enforces the substantive rules (two stylistic rules are disabled in
      # .gdlintrc, documented there). Both are blocking: the viewer was brought
      # gdformat-clean and gdlint-clean in this change.
      - name: gdtoolkit lint (gdformat + gdlint)
        run: |
          pipx install "gdtoolkit==4.*"
          echo "== gdformat --check =="
          gdformat --check game/scripts/
          echo "== gdlint =="
          gdlint game/scripts/
