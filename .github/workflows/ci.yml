name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      # fmt and doc are OS-independent by construction (source formatting +
      # rustdoc), so run them once on ubuntu rather than duplicating on the
      # scarcer macOS runner. clippy/test stay on both to catch platform cfg.
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --workspace --no-deps --document-private-items
      - name: test (lib + unit)
        run: cargo test --workspace --lib
      # Integration tests are NOT run here. They were a 15-minute debug-profile
      # simulation run whose every test also runs — in release, parallelized —
      # in the `emergence` job below (no test is debug-only), so the debug run
      # was pure redundancy. clippy --all-targets above still compile-checks the
      # integration binaries on both OSes; the doctests below still run in debug.
      - name: test (doc tests)
        run: cargo test --workspace --doc
      - name: bench compile check
        run: cargo bench --workspace --no-run

  # The integration + behavioural gate, in release so the emergence detectors
  # (M11-M15) — `#[cfg_attr(debug_assertions, ignore)]`, hence skipped in any
  # debug run — actually execute. A few detectors run multi-seed simulations and
  # dominate wall-time, so the suite is sharded. Balancing is left to nextest's
  # round-robin `--partition count`: shard wall-time is bounded below by the
  # single longest test either way, so hand-packing filtersets bought little
  # over simply using more shards, and every rename or new heavyweight test
  # meant re-tuning them by hand. Shards are a complete, disjoint partition, so
  # every test runs exactly once and all shards must pass. (Unconditionally
  # #[ignore]d experiment harnesses in gene_culture.rs / dit_boundary.rs stay
  # skipped — analysis tools, not gates.)
  emergence-shard:
    name: emergence shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          nextest: "true"
      - name: test (release) — shard ${{ matrix.shard }}/6
        run: cargo nextest run --workspace --release --partition count:${{ matrix.shard }}/6

  # Fan-in: keeps a single `emergence (release)` status check (matching the name
  # branch protection may require) and fails if any shard failed. `if: always()`
  # so it runs even when a shard fails (a failed `needs` otherwise just skips it).
  emergence:
    name: emergence (release)
    needs: emergence-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all emergence shards passed
        run: |
          result='${{ needs.emergence-shard.result }}'
          echo "emergence-shard matrix result: $result"
          [ "$result" = "success" ] || { echo "::error::an emergence shard did not pass"; exit 1; }

  # Coverage is collected in parallel shards, then unioned in the `coverage` job.
  # Instrumented execution is ~5-10x slower per tick. The tests whose claim does
  # not depend on horizon length shorten under `cfg(coverage)` (see
  # `common::ticks`) — notably `all_scenarios`, which tick-loops every scenario
  # back-to-back and was this job's tallest pole. Behavioural tests that need
  # their full horizon to observe the emergence they assert (`traditions`, the
  # `trade` turnover sims) keep it, so shards are not perfectly even; more
  # shards absorbs that, which is cheaper to maintain than the bin-packed
  # filtersets this job used to carry and re-tune on every rename.
  # `--lcov` emits a SELF-CONTAINED tracefile per shard (that shard's own
  # binaries + profile), so the report job can union them WITHOUT any
  # cross-machine profraw/binary matching. Coverage reflects the always-on lib +
  # integration suite; doctests aren't measured (nextest doesn't run them) and
  # the emergence detectors run in debug here, where they're #[ignore]d.
  coverage-collect:
    name: coverage shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          nextest: "true"
          coverage: "true"
      - name: collect coverage (shard ${{ matrix.shard }}/6)
        run: >
          cargo llvm-cov nextest --workspace
          --partition count:${{ matrix.shard }}/6
          --lcov --output-path lcov-${{ matrix.shard }}.info
      - name: upload shard tracefile
        uses: actions/upload-artifact@v7
        with:
          name: lcov-shard-${{ matrix.shard }}
          path: lcov-${{ matrix.shard }}.info
          if-no-files-found: error

  coverage:
    name: coverage
    needs: coverage-collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: download shard tracefiles
        uses: actions/download-artifact@v8
        with:
          pattern: lcov-shard-*
          path: shards
          merge-multiple: true
      # Union the shards' per-line hits and enforce the floors in one pass. A
      # line counts as covered if ANY shard executed it. Pure awk over the lcov
      # DA records — no lcov CLI — so the gate is independent of tool version.
      # Raise these floors when coverage climbs; never lower them silently.
      - name: gate — line coverage floors (workspace >= 82%, anabios-core >= 95%)
        run: awk -v wmin=82 -v cmin=95 -f .github/scripts/lcov-line-gate.awk shards/*.info
      # Machine-readable tracefiles for humans/tools (Codecov, editors). Not a
      # gate; runs even when the gate above fails so the artifacts are available
      # to debug.
      - name: upload lcov artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: shards
          if-no-files-found: warn

  determinism:
    name: determinism smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      # The golden state hashes are pinned to bit-identical values across OSes
      # (transcendentals are routed through libm/mathf precisely so macOS and
      # Linux agree). That claim is only meaningful if it is actually run on
      # both, so gate the golden-hash + parallel-vs-serial determinism tests on
      # the matrix, in release (the profile the hashes are validated in).
      - name: golden-hash + parallel determinism (cross-OS)
        run: cargo test -p anabios-core --release --test determinism
      # Run-to-run smoke: the headless binary must produce identical output on
      # two independent runs of the same seed. Reuses the release build above.
      - name: build release headless
        run: cargo build --release -p anabios-headless
      - name: run twice and diff
        run: |
          set -euo pipefail
          a=$(./target/release/anabios-headless run --scenario scenarios/minimal.toml --ticks 1000 | tail -n 1)
          b=$(./target/release/anabios-headless run --scenario scenarios/minimal.toml --ticks 1000 | tail -n 1)
          echo "a=$a"
          echo "b=$b"
          [ "$a" = "$b" ] || (echo "non-deterministic output" && exit 1)

  godot:
    name: godot viewer (headless smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      # The Godot viewer is a gdextension backed by the `anabios-godot` crate.
      # Nothing else in CI actually builds or loads it — clippy only
      # compile-checks the crate and the coverage job excludes it — so a broken
      # gdext binding or a scene/script regression would ship undetected. Build
      # the cdylib the `.gdextension` loads (its linux entry points at
      # target/debug/libanabios_godot.so), then load the scenes headless.
      - name: build gdext cdylib
        run: cargo build -p anabios-godot
      # Headless `godot` from the official release — replaces lihop/setup-godot,
      # which still declares the node20 runtime GitHub is deprecating. Keep the
      # version aligned with the viewer's target engine (game/project.godot).
      - name: install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m755 /tmp/godot-bin/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      # Import so `.godot/` exists (git-ignored): it holds `extension_list.cfg`
      # — which the runtime reads to load the gdextension — and the imported
      # assets. `--import` runs the editor; on a GPU-less runner the editor GUI
      # SIGABRTs under software (llvmpipe) Vulkan *after* import + extension
      # registration complete, so tolerate a non-zero exit and assert the cache
      # instead. (Belt-and-suspenders: write extension_list.cfg if the crash
      # happened before Godot flushed it.)
      - name: import project (headless)
        run: |
          godot --headless --path game --import || true
          mkdir -p game/.godot
          grep -q 'anabios.gdextension' game/.godot/extension_list.cfg 2>/dev/null \
            || echo 'res://anabios.gdextension' > game/.godot/extension_list.cfg
          echo "extension_list.cfg:"; cat game/.godot/extension_list.cfg
          # Fennara is local editor tooling and is intentionally ignored by
          # Git. Remove its optional runtime autoload on CI when the addon is
          # absent, otherwise every smoke process emits a missing-script error.
          if [ ! -f game/addons/fennara/runtime/game_capture_helper.gd ]; then
            sed -i '/^_fennara_game_capture=/d' game/project.godot
          fi
      # Both smoke modes live in scripts/godot-smoke.sh — they assert on log
      # *content* because Godot exits 0 on a script that fails to parse.
      - name: scene-load smoke (menu + sim)
        run: scripts/godot-smoke.sh scenes res://scenes/menu.tscn res://scenes/main.tscn
      # Sprite-module unit tests: SceneTree harnesses over the block-art tables
      # (building/goods/cart sprites, the mammal archetype registry, event FX).
      - name: sprite module tests
        run: scripts/godot-smoke.sh scripts test_building_sprites test_mammal_sprites test_event_fx test_emote_sprites test_terrain_sprites test_terrain_scatter test_trail_layer test_biome_props test_pixel_fx_sprites test_atlas_registry
      # GDScript lint/format gate (gdtoolkit — the clippy/rustfmt analog for
      # GDScript). `gdformat --check` enforces formatting/width; `gdlint`
      # enforces the substantive rules (two stylistic rules are disabled in
      # .gdlintrc, documented there). Both are blocking.
      - name: gdtoolkit lint (gdformat + gdlint)
        run: |
          pipx install "gdtoolkit==4.*"
          echo "== gdformat --check =="
          gdformat --check game/scripts/
          echo "== gdlint =="
          gdlint game/scripts/
